name: CI

# The library built for every target framework and packed as nuget.org would
# receive it, and the tests run on each framework.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build and pack the NuGet package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # packages.lock.json is the record of what the package depends on;
      # locked mode fails instead of resolving anything it does not name.
      - name: Restore from the lock file
        run: dotnet restore Transformer.sln --locked-mode

      # Builds net8.0, net9.0 and net10.0; a missing XML comment is a warning,
      # so this also fails on an undocumented public member.
      - name: Build Release with warnings as errors
        run: dotnet build Transformer.sln --no-restore -c Release -warnaserror

      - name: Pack
        run: dotnet pack Transformer.sln --no-build -c Release -o dist

      # nuget.org shows the README and the icon, and IntelliSense reads the
      # XML docs: a package without any of them is a broken release. The
      # package is WilliamSmithE.Transformer; the assembly is Transformer.dll.
      - name: Check the package holds each framework's dll and XML docs, the README and the icon
        run: |
          set -- dist/WilliamSmithE.Transformer.*.nupkg
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "want exactly one WilliamSmithE.Transformer .nupkg, found: $*"; exit 1; }
          unzip -p "$1" README.md > packaged-readme.md
          cmp README.md packaged-readme.md
          unzip -Z1 "$1" > contents.txt
          cat contents.txt
          for tfm in net8.0 net9.0 net10.0; do
            for ext in dll xml; do
              want="lib/$tfm/Transformer.$ext"
              grep -qxF "$want" contents.txt || { echo "missing from the package: $want"; exit 1; }
            done
          done
          for want in README.md Transformer.png; do
            grep -qxF "$want" contents.txt || { echo "missing from the package: $want"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: dist/
          if-no-files-found: error

  # The tests, once per target framework. Some set a culture of their own,
  # such as de-DE or tr-TR, because conversions read text in the current
  # culture. Nothing reaches the network. --fail-skips turns a skipped test
  # into a failure.
  test:
    name: Test (net8.0, net9.0, net10.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK comes from global.json. The .NET 8 and 9 runtimes the tests
      # run on come from the SDKs named here, exact releases; move them by
      # hand to the newest 8.0 and 9.0 SDKs that are a week old
      # (https://dotnet.microsoft.com/download/dotnet).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.425
            9.0.318
          global-json-file: global.json

      - name: Restore from the lock file
        run: dotnet restore Transformer.sln --locked-mode

      - name: Build Release
        run: dotnet build Transformer.sln --no-restore -c Release

      - name: Run the tests (fails on a skipped test)
        run: dotnet test --solution Transformer.sln -c Release --no-build --fail-skips on

  # The one check the main ruleset requires. It fails unless every job above
  # passed, a skipped one included.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
